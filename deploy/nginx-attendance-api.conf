location /api/attendance/ {
    proxy_pass http://127.0.0.1:3000/api/attendance/;
    proxy_http_version 1.1;
    client_max_body_size 12m;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Location-Code $http_x_location_code;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
}

# Option B — dedicated host (attendance-api.walkingtree.tech).
# Use a separate server { } that proxies / and /health to 127.0.0.1:3000.
